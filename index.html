<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>MQTT Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-box { border: 1px solid #ccc; padding: 10px; height: 320px; overflow-y: auto; margin-bottom: 12px; }
        .message { margin-bottom: 6px; }
        form input, form button { padding: 8px; margin-right: 6px; }
        small { color: #666; }
    </style>
</head>
<body>
    <h1>Linux Administration Chat</h1>
    <p>Hauku vaikka Linuxia</p>

    <div class="chat-box" id="chat-box">Ladataan viestejä...</div>

    <form id="chat-form">
        <input type="text" name="message" placeholder="Viesti" required>
        <button type="submit">Lähetä</button>
    </form>

    <script>
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages', { cache: 'no-store' });
                 const data = await res.json();
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                if (!Array.isArray(data) || data.length === 0) {
                    box.textContent = 'Ei viestejä vielä.';
                    return;
                }
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.innerHTML = `<b>${msg.nickname || 'Anon'}:</b> ${msg.message} <small>${msg.created_at}</sma>
                    box.appendChild(div);
                });
            } catch (e) {
                document.getElementById('chat-box').textContent = 'Virhe viestien haussa.';
            }
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const res = await fetch('/send', { method: 'POST', body: formData });
            if (res.ok) {
                form.reset();
                loadMessages();
            } else {
                alert(await res.text());
            }
       });

        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
