services:
  backend:
    build:
      context: ./backend
    container_name: lemp-cicd-backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:8081:5000"
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lemp-cicd-redis
    restart: unless-stopped
    expose:
      - "6379"
